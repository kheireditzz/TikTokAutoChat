name: Build Production AutoChat APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify or Generate Release Keystore
        run: |
          if [ ! -f "release.keystore" ]; then
            echo "Generating new keystore..."
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias autochat \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass autochatrelease \
              -keypass autochatrelease \
              -dname "CN=TikTokAutoChat, OU=Production, O=AutoChat Corp, L=Jakarta, ST=DKI, C=ID"
          else
            echo "Using committed permanent release.keystore for consistent signing."
          fi

      - name: Build Release Production APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokAutoChat-Production-APK
          path: app/build/outputs/apk/release/*.apk
